<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS LINK — Cross-Device Communication</title>
  <meta name="description" content="Real-time cross-device messaging and file sharing with a hacker aesthetic." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Particle Canvas Background -->
  <canvas id="particles-canvas"></canvas>

  <!-- CRT Scanline Overlay -->
  <div class="scanlines"></div>

  <!-- ========== JOIN SCREEN ========== -->
  <div id="join-screen" class="screen active">
    <div class="join-container">
      <div class="logo-area">
        <div class="logo-glitch" data-text="NEXUS LINK">NEXUS LINK</div>
        <div class="logo-sub">[ CROSS-DEVICE COMMUNICATION PROTOCOL ]</div>
      </div>

      <div class="terminal-box">
        <div class="terminal-header">
          <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
          <span class="terminal-title">// ESTABLISH CONNECTION</span>
        </div>
        <div class="terminal-body">
          <div class="input-group">
            <label for="device-name-input"><span class="prompt">&gt;</span> DEVICE_NAME</label>
            <input type="text" id="device-name-input" placeholder="Enter device name..." maxlength="30" autocomplete="off" />
          </div>
          <div class="input-group">
            <label for="room-id-input"><span class="prompt">&gt;</span> ROOM_ID</label>
            <input type="text" id="room-id-input" placeholder="Enter room code..." maxlength="20" autocomplete="off" />
            <button id="gen-room-btn" title="Generate random room ID">⟳ GENERATE</button>
          </div>
          <button id="connect-btn" class="connect-btn">
            <span class="btn-text">ESTABLISH LINK</span>
            <span class="btn-glow"></span>
          </button>
          <div id="join-error" class="error-msg hidden"></div>
        </div>
      </div>

      <div class="join-footer">
        <span class="blink-dot"></span> SECURE · PEER-TO-PEER · ENCRYPTED
      </div>
    </div>
  </div>

  <!-- ========== CHAT SCREEN ========== -->
  <div id="chat-screen" class="screen">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="nx-logo">NX</div>
        <div class="sidebar-info">
          <div class="sidebar-title">NEXUS LINK</div>
          <div class="sidebar-room">ROOM: <span id="sidebar-room-id">—</span></div>
        </div>
      </div>

      <div class="online-section">
        <div class="section-label">// ONLINE DEVICES</div>
        <div id="device-list" class="device-list"></div>
        <div class="online-count">
          <span class="pulse-dot"></span>
          <span id="online-count">0</span> DEVICE(S) ONLINE
        </div>
      </div>

      <div class="sidebar-actions">
        <button id="copy-room-btn" class="side-btn">⧉ COPY ROOM ID</button>
        <button id="disconnect-btn" class="side-btn danger">✕ DISCONNECT</button>
      </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="chat-main">
      <div class="chat-header">
        <div class="header-status">
          <span class="pulse-dot"></span>
          <span id="header-room-label">ROOM: —</span>
        </div>
        <div id="header-device-name" class="header-device"></div>
      </div>

      <!-- Messages -->
      <div id="messages-container" class="messages-container">
        <div class="messages-inner" id="messages-inner">
          <!-- System welcome message injected by JS -->
        </div>
      </div>

      <!-- Typing Indicator -->
      <div id="typing-indicator" class="typing-indicator hidden">
        <span id="typing-text"></span>
        <span class="typing-dots"><span></span><span></span><span></span></span>
      </div>

      <!-- Input Bar -->
      <div class="input-bar">
        <label for="file-input" class="attach-btn" title="Attach file">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66L9.41 17.41a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
          </svg>
        </label>
        <input type="file" id="file-input" multiple accept="*/*" style="display:none" />

        <div id="file-preview-strip" class="file-preview-strip hidden"></div>

        <input
          type="text"
          id="message-input"
          class="message-input"
          placeholder="Type a message or paste text..."
          autocomplete="off"
          maxlength="5000"
        />
        <button id="send-btn" class="send-btn" title="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </main>
  </div>

  <!-- ========== FILE PREVIEW MODAL ========== -->
  <div id="preview-modal" class="modal hidden">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-content">
      <div class="modal-header">
        <span id="modal-filename" class="modal-title"></span>
        <button id="modal-close" class="modal-close">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div class="modal-footer">
        <a id="modal-download" class="download-btn" download>⬇ DOWNLOAD FILE</a>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast hidden"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
